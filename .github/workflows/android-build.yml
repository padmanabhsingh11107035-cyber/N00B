name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'N00B_fixed/instagram/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: N00B_fixed/instagram
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 & accept licenses
        # Capacitor's Android template currently targets compileSdkVersion 36,
        # which android-actions/setup-android doesn't install by default —
        # without this, the Gradle build fails trying to fetch it mid-build
        # without a pre-accepted license.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install web app dependencies
        run: npm install

      - name: Build web app (pointed at the deployed backend)
        run: npm run build
        env:
          # The native app has no backend of its own — every relative
          # /api call gets rewritten to this URL at build time (see
          # src/main.tsx). Change this if the Railway URL ever changes.
          VITE_API_BASE: https://n00b-production.up.railway.app/api

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web build into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: N00B_fixed/instagram/android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle_output.log 2>&1
          exit_code=$?
          tail -c 100000 /tmp/gradle_output.log
          if [ "$exit_code" -ne 0 ]; then
            curl -s -X POST "https://n00b-production.up.railway.app/api/internal/ci-log" \
              -H "X-CI-Relay-Token: noob-ci-debug-relay-8f2a9d3c" \
              --data-binary @/tmp/gradle_output.log > /dev/null
          fi
          exit $exit_code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noob-debug-apk
          path: N00B_fixed/instagram/android/app/build/outputs/apk/debug/app-debug.apk
