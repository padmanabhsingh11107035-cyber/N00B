name: Build Android APK

on:
  workflow_dispatch: {}
  # The app is a window onto the live website (capacitor.config.json: server.url), so ordinary changes reach everybody as soon as the website is updated. A new app file is only
  # needed when something NATIVE changes (these files); then it is built, and published for the "Update the app" button inside the app.
  push:
    branches: [main, supabase-migration]
    paths:
      - 'N00B_fixed/instagram/android-overrides/**'
      - 'N00B_fixed/instagram/capacitor.config.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write      # to publish the newest app file as a release (the in-app "Update NOOB" page links to it)

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: N00B_fixed/instagram
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        # packages is pinned to platform-tools only: the action's own default
        # list still requests the legacy "tools" package, which Google pulled
        # from its SDK repository on 2026-09-14, making every setup-android@v3
        # run fail here. The next step installs everything else we need.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform 36 & accept licenses
        # Capacitor's Android template currently targets compileSdkVersion 36,
        # which android-actions/setup-android doesn't install by default —
        # without this, the Gradle build fails trying to fetch it mid-build
        # without a pre-accepted license.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install web app dependencies
        run: npm install

      - name: Build web app (pointed at the deployed backend)
        run: npm run build
        env:
          # The native app has no backend of its own — every relative
          # /api call gets rewritten to this URL at build time (see
          # src/main.tsx). Reads from the repo's Actions "variables" (not
          # secrets — it's just a public URL) so switching backends is a
          # Settings edit, not a code change: Settings → Secrets and
          # variables → Actions → Variables tab → add BACKEND_API_BASE.
          # Falls back to the current custom domain until that variable is
          # set — never the underlying host, so the built app never has any
          # reason to talk to (or reveal) it directly.
          VITE_API_BASE: ${{ vars.BACKEND_API_BASE || 'https://nooob.xyz/api' }}
          # The website's main address: where the Android app loads pictures and videos from (/media/...) and what its links say. Set the repo variable
          # SITE_URL (Settings -> Secrets and variables -> Actions -> Variables) only to use a different one; the default is the new .com.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://noobsocials.com' }}

      - name: Add Android platform
        run: npx cap add android

      - name: Native parts (secure window, and the in-app "Update the app" installer)
        run: |
          cp android-overrides/MainActivity.java android/app/src/main/java/com/noob/social/MainActivity.java
          cp android-overrides/AppUpdaterPlugin.java android/app/src/main/java/com/noob/social/AppUpdaterPlugin.java
          # Android only lets an app start the installer when it says so in its manifest (the person still has to allow it once, and confirm each install)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#& <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" /> <uses-permission android:name="android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION" />#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          grep -q UPDATE_PACKAGES_WITHOUT_USER_ACTION android/app/src/main/AndroidManifest.xml

      - name: Generate app icon & splash screen from the NOOB logo
        # Installed here rather than as a committed devDependency: it pulls in
        # sharp (a native module), and this way a hiccup there can only ever
        # affect this Android build, never the Railway web deploy.
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync web build into the native project
        run: npx cap sync android

      # Firebase Cloud Messaging config for push notifications (optional —
      # only written once the GOOGLE_SERVICES_JSON secret is set; Capacitor's
      # template already skips the google-services Gradle plugin cleanly
      # when this file is absent, so nothing breaks before then).
      - name: Add Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      # Play Store requires an increasing versionCode on every upload and a
      # release build signed with a persistent keystore, not the debug key.
      - name: Set app version
        run: |
          {
            echo ''
            echo 'android {'
            echo '    defaultConfig {'
            echo "        versionCode ${{ github.run_number }}"
            echo "        versionName \"1.0.${{ github.run_number }}\""
            echo '    }'
            echo '}'
          } >> android/app/build.gradle

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo ''
              echo 'android {'
              echo '    signingConfigs {'
              echo '        release {'
              echo '            storeFile file("release.keystore")'
              echo '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")'
              echo '            keyAlias System.getenv("ANDROID_KEY_ALIAS")'
              echo '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")'
              echo '        }'
              echo '    }'
              echo '    buildTypes {'
              echo '        release {'
              echo '            signingConfig signingConfigs.release'
              echo '        }'
              echo '    }'
              echo '}'
            } >> android/app/build.gradle
          fi

      # The same signing key on every build: Android only installs an app OVER an older copy when both were signed with the same key. Without this every build
      # got a fresh random key, so nobody could update, they had to remove the old app first. (This is the standard "debug" key; the app file is for sideloading.)
      - name: Use the fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp android-overrides/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK (for sideloading / testing)
        working-directory: N00B_fixed/instagram/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: noob-debug-apk
          path: N00B_fixed/instagram/android/app/build/outputs/apk/debug/app-debug.apk

      # The newest app file, at one fixed address, for the "Update NOOB" page inside the app:
      # https://github.com/<repo>/releases/download/android-latest/NOOB.apk
      - name: Publish the app file for the in-app update page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NOOB.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "${{ github.sha }}" --title "NOOB for Android (newest)" --notes "The newest NOOB app for Android."
          fi
          gh release edit android-latest --title "NOOB for Android (newest)" --notes "The newest NOOB app for Android. Native build: ${{ github.run_number }}. Built from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Open the file on your phone to install it over the old one."
          echo '{"build": ${{ github.run_number }}}' > native.json
          gh release upload android-latest NOOB.apk native.json --clobber

      - name: Build signed release AAB (for Play Store)
        working-directory: N00B_fixed/instagram/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "app/release.keystore" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            echo "No release keystore configured yet (ANDROID_KEYSTORE_BASE64 secret not set) — skipping signed AAB build."
          fi

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: noob-release-aab
          path: N00B_fixed/instagram/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
