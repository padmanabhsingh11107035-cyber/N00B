  <body class="bg-page text-white antialiased selection:bg-noob selection:text-black">
    <!-- Opening splash: a full black screen with the NOOB logo in the middle, drawn by the page itself so it shows the very first
         moment the app is opened. src/main.tsx fades it away once the app has started (then the loading screen and the app follow). -->
    <div id="noob-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease;">
      <style>
        @keyframes noob-splash-in { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
        @keyframes noob-splash-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.0), 0 0 40px 6px rgba(255,255,255,.22); } 50% { box-shadow: 0 0 0 0 rgba(255,255,255,.0), 0 0 70px 14px rgba(255,255,255,.38); } }
        #noob-splash img { width: 116px; height: 116px; border-radius: 50%; object-fit: cover; animation: noob-splash-in .55s cubic-bezier(.2,.8,.2,1) both, noob-splash-glow 1.8s ease-in-out .5s infinite; }
        @media (prefers-reduced-motion: reduce) { #noob-splash img { animation: none; } }
      </style>
      <img src="/noob-logo-circle.png" alt="" width="116" height="116" />
    </div>
    <!-- On the coaching address (coaching.nooob.xyz, or any address opened with ?coaching=1) the page is NOOB STUDY: its own logo on the black opening screen
         (3 seconds), its own name and icon. Everywhere else nothing changes. -->
    <script>
      (function () {
        try {
          if (!/^coaching\./i.test(location.hostname) && !/[?&]coaching=1/.test(location.search)) return;
          window.__splashSeconds = 3;
          var img = document.querySelector('#noob-splash img');
          if (img) { img.src = '/noob-study-logo.svg'; img.setAttribute('width', '260'); img.setAttribute('height', '260'); img.style.cssText = 'width:min(62vw,260px);height:auto;aspect-ratio:1/1;border-radius:0;object-fit:contain'; }
          document.title = 'NOOB STUDY';
          var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
          set('link[rel="manifest"]', 'href', '/manifest-study.json');
          set('link[rel="icon"]', 'href', '/noob-study-logo-192.png');
          set('link[rel="apple-touch-icon"]', 'href', '/noob-study-logo-512.png');
          set('meta[name="theme-color"]', 'content', '#000000');
          set('meta[name="apple-mobile-web-app-title"]', 'content', 'NOOB STUDY');
        } catch (e) { /* the normal page still works */ }
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <style>#noob-splash { display: none !important; }</style>
