    <!-- Opening splash: a full yellow screen with the NOOB logo (no words), drawn by the page itself so it shows the very first moment the app is opened, behind the notch / camera /
         status bar at the top and the home bar / navigation bar at the bottom (public/splash.js, loaded in the head, keeps the page and the browser's theme colour yellow while it shows).
         It stays at least 1.1 s, until the app is ready (src/main.tsx and App.tsx call window.__noobSplash.ready()), and 1.8 s at most, then fades out in 0.25 s.
         The logo is public/brand/noob-splash-logo.svg. Only the editor address (NOOB Studio) keeps a black screen with its round logo: editor-init.js adds the class "logo". -->
    <div id="noob-splash" aria-hidden="true">
      <style>
        #noob-splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100vh; height: 100lvh; z-index: 2147483000; background: #F8CB46; display: flex; align-items: center; justify-content: center; transition: opacity .06s linear; }
        #noob-splash svg { display: block; width: min(62vw, 380px); height: auto; animation: ns-in .6s cubic-bezier(.2,.8,.2,1) both; }
        #noob-splash .ns-eye { transform-box: fill-box; transform-origin: center; }
        #noob-splash .ns-eye { animation: ns-glance 1.1s ease-in-out .3s both; }
        #noob-splash img { display: none; }
        #noob-splash.logo { background: #000; }
        #noob-splash.logo svg { display: none; }
        #noob-splash.logo img { display: block; width: 116px; height: 116px; border-radius: 24%; object-fit: cover; animation: ns-in .55s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes ns-in { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: scale(1); } }
        @keyframes ns-glance { 0% { transform: translate(0,0) scaleY(1); } 18% { transform: translate(0,0) scaleY(.12); } 30% { transform: translate(0,0) scaleY(1); } 55% { transform: translate(-16px,2px) scaleY(1); } 80% { transform: translate(-16px,2px) scaleY(1); } 100% { transform: translate(0,0) scaleY(1); } }
        @media (prefers-reduced-motion: reduce) { #noob-splash svg, #noob-splash .ns-eye, #noob-splash.logo img { animation: none; } }
      </style>
