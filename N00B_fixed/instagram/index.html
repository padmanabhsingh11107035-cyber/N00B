<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NOOB - Fun & Connecting People</title>
    <link rel="icon" type="image/png" href="/noob-logo-circle.png" />
    <link rel="apple-touch-icon" href="/noob-logo-circle.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#d97757" />
    <script src="/theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOOB" />
    <meta name="description" content="NOOB is a social media interaction app designed for fun, sharing moments, and connecting people with genuine interactions, real profiles, and community discovery." />
    <meta property="og:title" content="NOOB - Fun & Connecting People" />
    <meta property="og:description" content="NOOB is a social media interaction app designed for fun, sharing moments, and connecting people with genuine interactions, real profiles, and community discovery." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nooob.xyz/" />
    <meta property="og:image" content="https://nooob.xyz/noob-logo-circle.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://nooob.xyz/noob-logo-circle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Grand+Hotel&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-page text-white antialiased selection:bg-noob selection:text-black">
    <!-- Opening splash: a full black screen with the NOOB logo in the middle, drawn by the page itself so it shows the very first
         moment the app is opened. src/main.tsx fades it away once the app has started (then the loading screen and the app follow). -->
    <div id="noob-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease;">
      <style>
        @keyframes noob-splash-in { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
        @keyframes noob-splash-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(217,119,87,.0), 0 0 40px 6px rgba(217,119,87,.22); } 50% { box-shadow: 0 0 0 0 rgba(217,119,87,.0), 0 0 70px 14px rgba(217,119,87,.38); } }
        #noob-splash img { width: 116px; height: 116px; border-radius: 50%; object-fit: cover; animation: noob-splash-in .55s cubic-bezier(.2,.8,.2,1) both, noob-splash-glow 1.8s ease-in-out .5s infinite; }
        @media (prefers-reduced-motion: reduce) { #noob-splash img { animation: none; } }
      </style>
      <img src="/noob-logo-circle.png" alt="" width="116" height="116" />
    </div>
    <div id="root"></div>
    <noscript>
      <style>#noob-splash { display: none !important; }</style>
      <h1>NOOB</h1>
      <p>NOOB is a social app for sharing photos, reels and stories, chatting, playing games and connecting with friends. Turn on JavaScript to use it.</p>
      <p><a href="/privacy.html">Privacy Policy</a> &middot; <a href="/terms.html">Terms &amp; Conditions</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
