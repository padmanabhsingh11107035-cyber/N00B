            <style>#boot{z-index:2000;color:#f3ead7;background:#15130f;place-items:center;font-family:Sora,system-ui,sans-serif;transition:opacity .45s;display:grid;position:fixed;inset:0;overflow:hidden}#boot.done{opacity:0;pointer-events:none}.boot-shell{text-align:center;justify-items:center;gap:12px;width:min(560px,88vw);display:grid}.boot-mark{object-fit:contain;filter:drop-shadow(0 0 14px #f0b54a3d);width:58px;height:58px}.boot-title{letter-spacing:.12em;text-transform:uppercase;color:#f3ead7;margin:4px 0 0;font-size:clamp(2.7rem,9vw,5.3rem);font-weight:800;line-height:1}.boot-sub{letter-spacing:clamp(.12em,.75vw,.35em);text-transform:uppercase;color:#f0b54a;margin:0;font-size:clamp(.7rem,2.3vw,1.05rem);font-weight:600}.boot-foot{width:100%;margin-top:clamp(36px,9vh,76px)}.boot-text{color:#f3ead7e6;min-height:1.3em;margin-bottom:12px;font:500 .88rem/1.4 Figtree,system-ui,sans-serif}.boot-bar{background:#29241a;border:1px solid #f0b54a75;border-radius:99px;height:8px;position:relative;overflow:hidden}.boot-fill{transform-origin:0;background:#f0b54a;transition:transform .2s ease-out;position:absolute;inset:0;transform:scaleX(.02)}.boot-meta{color:#f3ead7ad;justify-content:space-between;gap:12px;margin-top:10px;font:.76rem/1.45 Figtree,system-ui,sans-serif;display:flex}.boot-tip{text-align:left}.boot-pct{color:#f0b54a;font-variant-numeric:tabular-nums}.boot-retry{color:#18140c;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:#f0b54a;border:1px solid #f0b54a;border-radius:7px;margin-top:22px;padding:10px 22px;font:700 .82rem Sora,system-ui,sans-serif}.boot-retry:hover{background:#ffd27a}.boot-retry:focus-visible{outline-offset:3px;outline:3px solid #fff}@media (max-width:560px){.boot-shell{width:88vw}.boot-mark{width:48px;height:48px}.boot-meta{font-size:.7rem}}@media (prefers-reduced-motion:reduce){#boot,.boot-fill{transition:none}}</style>

  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-shell">
        <img class="boot-mark" src="./favicon.png" alt="" width="58" height="58" />
        <div class="boot-title">Ashenfang</div>
        <div class="boot-sub">The Colossus Trail</div>
        <div class="boot-foot">
          <div class="boot-text" data-i18n="boot.loading">Preparing the Emberwild Basin…</div>
          <div class="boot-bar" role="progressbar" aria-label="Hunt loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="boot-fill"></div></div>
          <div class="boot-meta">
            <span class="boot-tip" data-i18n="boot.tip1">Tip: dodge through an attack at the last moment to trigger a Flow Evade.</span>
            <span class="boot-pct">0%</span>
          </div>
          <button class="boot-retry" type="button" data-i18n="boot.retry" hidden>Retry</button>
        </div>
      </div>
    </div>
  </body>
