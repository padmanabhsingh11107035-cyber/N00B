<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b2676" />
    <meta name="description" content="Brick Escape: slide the studded bricks out of the tray through the door of their own colour. A puzzle from NOOB Games." />
    <title>Brick Escape</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='3' width='16' height='18' rx='4' fill='%23ff5a9c'/%3E%3Ccircle cx='9' cy='9' r='2' fill='%23fff' fill-opacity='.7'/%3E%3Ccircle cx='15' cy='9' r='2' fill='%23fff' fill-opacity='.7'/%3E%3Ccircle cx='9' cy='15' r='2' fill='%23fff' fill-opacity='.7'/%3E%3Ccircle cx='15' cy='15' r='2' fill='%23fff' fill-opacity='.7'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./game.css?v=1" />
  </head>
  <body>
    <div id="app">
      <div id="sky" aria-hidden="true"></div>
      <header class="bar">
        <button id="levels" class="lvl" type="button" aria-label="Choose a level"><span>Level</span><b id="level">1</b></button>
        <div class="stat"><span>Moves</span><b id="moves">0</b></div>
        <div class="stat"><span>Par</span><b id="par">0</b></div>
        <div class="tools">
          <button id="rank" type="button" aria-label="Ranking: the highest levels" title="Ranking">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="hint" type="button" aria-label="Show the next move" title="Hint">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="undo" type="button" aria-label="Undo the last move" title="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M5 12h9a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>
          </button>
          <button id="restart" type="button" aria-label="Start this level again" title="Start again">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="sound" type="button" aria-label="Sound on or off" title="Sound">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <main id="stage">
        <div id="tray" role="group" aria-label="The tray of bricks">
          <div id="floor"></div>
        </div>
      </main>
      <p id="tip"></p>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="fx" aria-hidden="true"></div>

      <div id="win" hidden>
        <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
          <h2 id="winTitle">Cleared!</h2>
          <div id="stars" class="stars" aria-hidden="true"><i></i><i></i><i></i></div>
          <p id="winText"></p>
          <button id="next" type="button" class="primary">Next level</button>
          <button id="again" type="button" class="plain">Play this level again</button>
        </div>
      </div>

      <div id="menu" hidden>
        <div class="card wide" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
          <h2 id="menuTitle">Levels</h2>
          <div id="grid" class="grid"></div>
          <button id="menuClose" type="button" class="plain">Close</button>
        </div>
      </div>

      <div id="board" hidden>
        <div class="card board" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
          <h2 id="boardTitle">Ranking</h2>
          <p>The highest level each player has cleared</p>
          <ol id="boardList"></ol>
          <p id="boardMe" class="me"></p>
          <button id="boardClose" type="button" class="plain">Close</button>
        </div>
      </div>
    </div>
    <script src="./rules.js?v=1"></script>
    <script src="./levels.js?v=1"></script>
    <script src="./game.js?v=1"></script>
  </body>
</html>
