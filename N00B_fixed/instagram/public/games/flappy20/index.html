<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flappy Bird, 20 Levels · Made by NOOB developers</title>
<meta name="description" content="Flappy Bird with 20 levels: reach each target to unlock the next. Made by NOOB developers. Part of NOOB Games.">
<meta name="author" content="NOOB developers">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#1a1a2e; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',Arial,sans-serif; overflow:hidden; }
  #wrap { position:relative; width:min(100vw, 56vh); aspect-ratio:480/720; max-height:100vh; box-shadow:0 0 40px rgba(0,0,0,.6); }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
  .overlay { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5; }
  .panel { background:rgba(0,0,0,.72); border:3px solid #fff; border-radius:14px; padding:20px 26px; text-align:center; color:#fff; }
  h1 { font-size:34px; color:#ffd93b; text-shadow:2px 2px 0 #000, -1px -1px 0 #000; letter-spacing:1px; }
  h2 { font-size:24px; color:#ffd93b; text-shadow:2px 2px 0 #000; }
  p { font-size:14px; text-shadow:1px 1px 0 #000; }
  #levelGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:8px; }
  .lvlBtn { width:56px; height:48px; font-size:18px; font-weight:bold; border:2px solid #2e7d32; border-radius:8px; background:linear-gradient(#aed581,#7cb342); color:#1b3a1b; cursor:pointer; box-shadow:0 3px 0 #33691e; }
  .lvlBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #33691e; }
  .lvlBtn.locked { background:#9e9e9e; border-color:#616161; color:#424242; box-shadow:0 3px 0 #424242; cursor:not-allowed; }
  .lvlBtn.done { background:linear-gradient(#fff59d,#fbc02d); }
  button.big { font-size:17px; font-weight:bold; padding:10px 22px; border-radius:10px; border:2px solid #000; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.5); }
  button.big:active { transform:translateY(2px); box-shadow:none; }
  .btnGreen { background:linear-gradient(#aed581,#689f38); color:#123; }
  .btnOrange { background:linear-gradient(#ffcc80,#fb8c00); color:#3a2000; }
  .btnGray { background:linear-gradient(#e0e0e0,#9e9e9e); color:#222; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="720"></canvas>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>FLAPPY BIRD</h1>
      <p>Select a level — reach the target score to unlock the next!</p>
      <div id="levelGrid"></div>
      <p id="bestLine" style="margin-top:8px;font-size:12px;color:#ffe082;"></p>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="panel">
      <h2 id="goTitle">GAME OVER</h2>
      <p id="goScore"></p>
      <p id="goBest"></p>
      <div class="row" style="margin-top:12px;">
        <button class="big btnOrange" id="btnRetry">↻ Retry</button>
        <button class="big btnGreen hidden" id="btnNext">Next ▶</button>
        <button class="big btnGray" id="btnLevels">☰ Levels</button>
      </div>
    </div>
  </div>
</div>
<script src="/games/_shared/noob-score.js" data-game="flappy20"></script>
<script src="./flappy.js?v=1"></script>
</body>
</html>
