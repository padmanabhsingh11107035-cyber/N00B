        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? (zh ? '暂未看到新的加载进度。可以继续等待，或重试。' : 'No recent loading progress. You can keep waiting or retry.')
          : (zh ? '仍在加载。可以继续等待，或重试。' : 'Still loading. You can keep waiting or retry.');
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = zh ? '游戏加载失败，请重试。' : 'Unable to load the game. Please retry.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = zh ? '正在加载…' : 'Loading…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? (zh ? '正在启动游戏…' : 'Starting game…')
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
