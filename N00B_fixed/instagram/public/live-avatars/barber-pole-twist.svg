<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bp-stripes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2b4d"/><stop offset="16%" stop-color="#ff8a3d"/>
      <stop offset="33%" stop-color="#ffe93d"/><stop offset="50%" stop-color="#3dffb0"/>
      <stop offset="66%" stop-color="#3dc8ff"/><stop offset="83%" stop-color="#a25bff"/><stop offset="100%" stop-color="#ff2b4d"/>
    </linearGradient>
    <pattern id="bp-pat" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="40" height="40" fill="url(#bp-stripes)"/>
    </pattern>
    <clipPath id="bp-clip"><circle cx="100" cy="100" r="65"/></clipPath>
    <style>
      .stripes { animation: bp-scroll 1.4s linear infinite; }
      @keyframes bp-scroll { from { transform: translateY(0); } to { transform: translateY(-40px); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bp-bg)"/>
  <rect class="stripes" x="20" y="20" width="220" height="220" clip-path="url(#bp-clip)" fill="url(#bp-pat)"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
</svg>
