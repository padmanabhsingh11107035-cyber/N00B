<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bh-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0410"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="bh-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="62%" stop-color="#ffb347"/>
      <stop offset="75%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#3a1a5c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .disk { transform-origin: 100px 100px; animation: bh-spin 3s linear infinite, bh-glow 2.4s ease-in-out infinite; }
      @keyframes bh-spin { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1); } }
      @keyframes bh-glow { 0%, 100% { filter: drop-shadow(0 0 6px #c77dff); } 50% { filter: drop-shadow(0 0 16px #ffb347); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bh-bg)"/>
  <ellipse class="disk" cx="100" cy="100" rx="72" ry="26" fill="none" stroke="url(#bh-disk)" stroke-width="10" opacity="0.9"/>
  <circle cx="100" cy="100" r="34" fill="#000000"/>
</svg>
