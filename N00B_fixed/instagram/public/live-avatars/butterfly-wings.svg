<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bw-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12051c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bw-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6bcb"/>
      <stop offset="50%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#6bc7ff"/>
    </linearGradient>
    <style>
      .wingL { transform-origin: 100px 100px; animation: bw-flapL 1s ease-in-out infinite; }
      .wingR { transform-origin: 100px 100px; animation: bw-flapR 1s ease-in-out infinite; }
      @keyframes bw-flapL {
        0%, 100% { transform: scaleX(1); }
        50%      { transform: scaleX(0.55); }
      }
      @keyframes bw-flapR {
        0%, 100% { transform: scaleX(1); }
        50%      { transform: scaleX(0.55); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bw-bg)"/>

  <g class="wingL">
    <path d="M100 100 C 70 65, 35 70, 32 100 C 30 122, 55 128, 78 112 C 90 104, 98 100, 100 100 Z" fill="url(#bw-wing)" opacity="0.92" stroke="#fff" stroke-width="0.5"/>
    <path d="M100 100 C 78 118, 55 145, 62 162 C 68 175, 88 160, 96 130 C 99 118, 100 108, 100 100 Z" fill="url(#bw-wing)" opacity="0.8" stroke="#fff" stroke-width="0.5"/>
  </g>
  <g class="wingR">
    <path d="M100 100 C 130 65, 165 70, 168 100 C 170 122, 145 128, 122 112 C 110 104, 102 100, 100 100 Z" fill="url(#bw-wing)" opacity="0.92" stroke="#fff" stroke-width="0.5"/>
    <path d="M100 100 C 122 118, 145 145, 138 162 C 132 175, 112 160, 104 130 C 101 118, 100 108, 100 100 Z" fill="url(#bw-wing)" opacity="0.8" stroke="#fff" stroke-width="0.5"/>
  </g>
  <ellipse cx="100" cy="100" rx="4" ry="26" fill="#2b1a3d"/>
</svg>
