<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ct-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .reel { transform-box: fill-box; transform-origin: center; animation: ct-spin 1.6s linear infinite; }
      @keyframes ct-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ct-bg)"/>
  <rect x="35" y="65" width="130" height="80" rx="10" fill="#2b2130" stroke="#4a3a55" stroke-width="2"/>
  <rect x="50" y="80" width="100" height="30" rx="4" fill="#120c17"/>
  <g class="reel">
    <circle cx="75" cy="95" r="17" fill="#0a060d" stroke="#c77dff" stroke-width="2"/>
    <line x1="75" y1="82" x2="75" y2="108" stroke="#c77dff" stroke-width="2"/>
    <line x1="62" y1="95" x2="88" y2="95" stroke="#c77dff" stroke-width="2"/>
  </g>
  <g class="reel">
    <circle cx="125" cy="95" r="17" fill="#0a060d" stroke="#c77dff" stroke-width="2"/>
    <line x1="125" y1="82" x2="125" y2="108" stroke="#c77dff" stroke-width="2"/>
    <line x1="112" y1="95" x2="138" y2="95" stroke="#c77dff" stroke-width="2"/>
  </g>
  <rect x="55" y="122" width="90" height="12" rx="3" fill="#1a1220"/>
</svg>
