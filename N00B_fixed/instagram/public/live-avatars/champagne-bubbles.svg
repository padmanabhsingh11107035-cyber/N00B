<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="cbb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1608"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cbb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <clipPath id="cbb-clip"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .b1 { animation: cbb-rise 3.2s ease-in infinite; }
      .b2 { animation: cbb-rise 2.6s ease-in infinite 0.6s; }
      .b3 { animation: cbb-rise 3.6s ease-in infinite 1.1s; }
      .b4 { animation: cbb-rise 2.9s ease-in infinite 1.7s; }
      .b5 { animation: cbb-rise 3.1s ease-in infinite 0.3s; }
      @keyframes cbb-rise {
        0%   { transform: translateY(60px); opacity: 0; }
        15%  { opacity: 0.9; }
        85%  { opacity: 0.7; }
        100% { transform: translateY(-140px); opacity: 0; }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#cbb-bg)"/>

  <g clip-path="url(#cbb-clip)">
    <circle class="b1" cx="70" cy="150" r="5" fill="url(#cbb-gold)"/>
    <circle class="b2" cx="95" cy="150" r="3.5" fill="url(#cbb-gold)"/>
    <circle class="b3" cx="120" cy="150" r="6" fill="url(#cbb-gold)"/>
    <circle class="b4" cx="140" cy="150" r="3" fill="url(#cbb-gold)"/>
    <circle class="b5" cx="55" cy="150" r="4" fill="url(#cbb-gold)"/>
  </g>

  <path d="M75 60 L125 60 L115 110 C 115 122, 85 122, 85 110 Z" fill="none" stroke="url(#cbb-gold)" stroke-width="2.5"/>
  <line x1="100" y1="122" x2="100" y2="150" stroke="url(#cbb-gold)" stroke-width="2.5"/>
  <line x1="80" y1="150" x2="120" y2="150" stroke="url(#cbb-gold)" stroke-width="2.5"/>
</svg>
