    <path d="M100 100 L175 135 L142 125 Z" fill="#3dffb0"/>
    <path d="M100 100 L145 170 L130 138 Z" fill="#3dc8ff"/>
    <path d="M100 100 L100 180 L92 145 Z" fill="#4d5bff"/>
    <path d="M100 100 L55 170 L70 138 Z" fill="#a25bff"/>
    <path d="M100 100 L25 135 L58 125 Z" fill="#ff2bd6"/>
    <path d="M100 100 L20 100 L55 100 Z" fill="#ff2b4d"/>
    <path d="M100 100 L25 65 L58 75 Z" fill="#ff8a3d"/>
    <path d="M100 100 L55 30 L70 62 Z" fill="#ffe93d"/>
  </g>
  <circle cx="100" cy="100" r="20" fill="#000000"/>
