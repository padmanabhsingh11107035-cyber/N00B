<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="cs-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .burst { transform-origin: 100px 100px; animation: cs-spin 5s linear infinite; }
      @keyframes cs-spin {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.15); }
        100% { transform: rotate(360deg) scale(1); }
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#cs-bg)"/>
  <g class="burst">
    <path d="M100 100 L100 20 L108 55 Z" fill="#ff2b4d"/>
    <path d="M100 100 L145 30 L130 62 Z" fill="#ff8a3d"/>
