<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="cb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .blob1 { animation: cb-hue1 3.5s linear infinite; }
      .blob2 { animation: cb-hue2 4.5s linear infinite reverse; }
