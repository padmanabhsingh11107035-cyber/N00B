      @keyframes cb-hue2 { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#cb-bg)"/>
  <path class="blob1" d="M75 60 C 110 45, 150 65, 145 100 C 140 135, 105 150, 75 135 C 45 120, 40 80, 75 60 Z" fill="#ff2bd6" opacity="0.75"/>
  <path class="blob2" d="M120 70 C 150 90, 155 130, 120 145 C 85 160, 55 135, 60 100 C 65 65, 95 55, 120 70 Z" fill="#3dc8ff" opacity="0.65"/>
</svg>
