<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="cn-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="cn-c1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6bcb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6bcb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cn-c2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6bc7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6bc7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cn-c3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cn-clip"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .cloud1 { transform-origin: 100px 100px; animation: cn-drift1 7s ease-in-out infinite; }
      .cloud2 { transform-origin: 100px 100px; animation: cn-drift2 9s ease-in-out infinite; }
      .cloud3 { transform-origin: 100px 100px; animation: cn-drift3 6s ease-in-out infinite; }
      .star { animation: cn-twinkle 1.6s ease-in-out infinite; }
      @keyframes cn-drift1 { 0%, 100% { transform: translate(-10px, 5px) scale(1); } 50% { transform: translate(10px, -8px) scale(1.15); } }
      @keyframes cn-drift2 { 0%, 100% { transform: translate(12px, -6px) scale(1.1); } 50% { transform: translate(-12px, 8px) scale(0.95); } }
      @keyframes cn-drift3 { 0%, 100% { transform: translate(-6px, -8px) scale(0.9); } 50% { transform: translate(8px, 10px) scale(1.1); } }
      @keyframes cn-twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#cn-bg)"/>

  <g clip-path="url(#cn-clip)">
    <circle class="cloud1" cx="75" cy="85" r="42" fill="url(#cn-c1)"/>
    <circle class="cloud2" cx="130" cy="110" r="46" fill="url(#cn-c2)"/>
    <circle class="cloud3" cx="105" cy="130" r="36" fill="url(#cn-c3)"/>
  </g>

  <circle class="star" cx="55" cy="55" r="1.8" fill="#fff"/>
  <circle class="star" cx="150" cy="60" r="1.5" fill="#fff"/>
  <circle class="star" cx="140" cy="150" r="1.6" fill="#fff"/>
  <circle class="star" cx="60" cy="145" r="1.4" fill="#fff"/>
  <circle class="star" cx="100" cy="40" r="1.4" fill="#fff"/>
</svg>
