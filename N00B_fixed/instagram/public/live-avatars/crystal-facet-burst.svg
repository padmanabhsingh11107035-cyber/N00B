<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="cf-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08080e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .crystal { animation: cf-hue 4s linear infinite; }
      @keyframes cf-hue { 0% { filter: hue-rotate(0deg) drop-shadow(0 0 4px #fff); } 100% { filter: hue-rotate(360deg) drop-shadow(0 0 4px #fff); } }
      .ray { animation: cf-ray 2s ease-in-out infinite; }
      .r2 { animation-delay: 0.5s; } .r3 { animation-delay: 1s; } .r4 { animation-delay: 1.5s; }
      @keyframes cf-ray { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#cf-bg)"/>
  <g class="ray" stroke="#ffffff" stroke-width="2"><line x1="100" y1="20" x2="100" y2="45"/><line x1="180" y1="100" x2="155" y2="100"/></g>
  <g class="ray r2" stroke="#ffffff" stroke-width="2"><line x1="150" y1="35" x2="135" y2="55"/><line x1="50" y1="165" x2="65" y2="145"/></g>
  <g class="ray r3" stroke="#ffffff" stroke-width="2"><line x1="20" y1="100" x2="45" y2="100"/><line x1="100" y1="180" x2="100" y2="155"/></g>
  <g class="ray r4" stroke="#ffffff" stroke-width="2"><line x1="50" y1="35" x2="65" y2="55"/><line x1="150" y1="165" x2="135" y2="145"/></g>
  <polygon class="crystal" points="100,55 130,80 118,120 82,120 70,80" fill="#ff2bd6"/>
  <polygon class="crystal" points="100,55 118,120 100,145" fill="#3dc8ff" opacity="0.8"/>
  <polygon class="crystal" points="100,55 82,120 100,145" fill="#ffe93d" opacity="0.8"/>
</svg>
