<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="cg-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#001a0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cg-scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cg-clip"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .scan { animation: cg-sweep 2.2s linear infinite; }
      .grid { animation: cg-flicker 3s ease-in-out infinite; }
      @keyframes cg-sweep { 0% { transform: translateY(-40px); } 100% { transform: translateY(240px); } }
      @keyframes cg-flicker { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#cg-bg)"/>
  <g clip-path="url(#cg-clip)">
    <g class="grid" stroke="#00FF66" stroke-width="1">
      <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
      <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
      <line x1="40" y1="0" x2="40" y2="200"/><line x1="80" y1="0" x2="80" y2="200"/>
      <line x1="120" y1="0" x2="120" y2="200"/><line x1="160" y1="0" x2="160" y2="200"/>
    </g>
    <rect class="scan" x="0" y="-40" width="200" height="40" fill="url(#cg-scan)"/>
  </g>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#00FF66" stroke-width="2" opacity="0.6"/>
</svg>
