<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ds-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#031a24"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ds-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fe0ff"/>
      <stop offset="50%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="ds-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ds-clip">
      <path d="M100 45 L145 85 L122 150 L78 150 L55 85 Z"/>
    </clipPath>
    <style>
      .sparkle1 { animation: ds-pop 2s ease-in-out infinite; }
      .sparkle2 { animation: ds-pop 2s ease-in-out infinite 0.7s; }
      .shine { animation: ds-sweep 2.4s ease-in-out infinite; }
      @keyframes ds-pop {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        50%      { opacity: 1; transform: scale(1); }
      }
      @keyframes ds-sweep {
        0%   { transform: translateY(-70px); }
        100% { transform: translateY(70px); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#ds-bg)"/>

  <path d="M100 45 L145 85 L122 150 L78 150 L55 85 Z" fill="url(#ds-gem)" stroke="#e0f7ff" stroke-width="1.5"/>
  <path d="M55 85 L145 85 M100 45 L78 150 M100 45 L122 150" stroke="#e0f7ff" stroke-width="1" opacity="0.5" fill="none"/>

  <g clip-path="url(#ds-clip)">
    <rect class="shine" x="40" y="0" width="120" height="40" fill="url(#ds-shine)"/>
  </g>

  <circle class="sparkle1" cx="60" cy="60" r="2.5" fill="#fff"/>
  <circle class="sparkle2" cx="145" cy="115" r="2" fill="#fff"/>
</svg>
