<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="db-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#160022"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="db-ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5f5ff"/>
      <stop offset="60%" stop-color="#b9c2e0"/>
      <stop offset="100%" stop-color="#5a6488"/>
    </radialGradient>
    <style>
      .ball { transform-origin: 100px 100px; animation: db-spin 5s linear infinite; }
      .glint { animation: db-twinkle 1.3s ease-in-out infinite; }
      .g2 { animation-delay: 0.4s; } .g3 { animation-delay: 0.8s; }
      @keyframes db-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes db-twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#db-bg)"/>
  <g class="ball">
    <circle cx="100" cy="100" r="45" fill="url(#db-ball)"/>
    <g stroke="#7b86b3" stroke-width="1" opacity="0.7">
      <line x1="55" y1="100" x2="145" y2="100"/><line x1="100" y1="55" x2="100" y2="145"/>
      <line x1="68" y1="68" x2="132" y2="132"/><line x1="132" y1="68" x2="68" y2="132"/>
      <circle cx="100" cy="100" r="30" fill="none"/><circle cx="100" cy="100" r="15" fill="none"/>
    </g>
    <circle class="glint" cx="80" cy="82" r="3" fill="#fff"/>
    <circle class="glint g2" cx="118" cy="90" r="2.4" fill="#fff"/>
    <circle class="glint g3" cx="95" cy="120" r="2.6" fill="#fff"/>
  </g>
</svg>
