<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ec-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#031f10"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ec-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8ffd9"/>
      <stop offset="45%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00693a"/>
    </linearGradient>
    <style>
      .gem { animation: ec-glow 2.4s ease-in-out infinite; }
      .facet { animation: ec-shift 2.4s ease-in-out infinite; }
      @keyframes ec-glow {
        0%, 100% { filter: drop-shadow(0 0 5px #00e676); }
        50%      { filter: drop-shadow(0 0 18px #00e676); }
      }
      @keyframes ec-shift {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 0.8; }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#ec-bg)"/>

  <g class="gem">
    <rect x="65" y="65" width="70" height="70" rx="8" fill="url(#ec-gem)" stroke="#eafff2" stroke-width="2" transform="rotate(45 100 100)"/>
    <rect class="facet" x="78" y="78" width="44" height="44" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(45 100 100)"/>
    <line class="facet" x1="65" y1="100" x2="135" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.5" transform="rotate(45 100 100)"/>
    <line class="facet" x1="100" y1="65" x2="100" y2="135" stroke="#ffffff" stroke-width="1" opacity="0.5" transform="rotate(45 100 100)"/>
  </g>
</svg>
