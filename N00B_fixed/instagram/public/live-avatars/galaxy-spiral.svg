<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="gx-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0620"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="gx-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .spin { transform-origin: 100px 100px; animation: gx-spin 9s linear infinite; }
      .spinSlow { transform-origin: 100px 100px; animation: gx-spin 16s linear infinite; }
      .twinkle { animation: gx-twinkle 1.8s ease-in-out infinite; }
      @keyframes gx-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes gx-twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#gx-bg)"/>

  <g class="spin">
    <path d="M100 100 C 130 90, 155 105, 150 130 C 146 150, 120 155, 105 140" fill="none" stroke="#9d4edd" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M100 100 C 70 110, 45 95, 50 70 C 54 50, 80 45, 95 60" fill="none" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  </g>

  <g class="spinSlow">
    <circle class="twinkle" cx="150" cy="130" r="2" fill="#fff"/>
    <circle class="twinkle" cx="50" cy="70" r="2" fill="#fff"/>
    <circle class="twinkle" cx="40" cy="140" r="1.6" fill="#fff"/>
    <circle class="twinkle" cx="160" cy="60" r="1.6" fill="#fff"/>
  </g>

  <circle cx="100" cy="100" r="22" fill="url(#gx-core)"/>
</svg>
