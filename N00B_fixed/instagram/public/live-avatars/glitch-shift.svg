<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="gs-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="gs-clip"><circle cx="100" cy="100" r="95"/></clipPath>
    <style>
      .bar { animation: gs-jump 1.2s steps(1) infinite; }
      .bar2 { animation-delay: -0.2s; } .bar3 { animation-delay: -0.4s; } .bar4 { animation-delay: -0.6s; } .bar5 { animation-delay: -0.8s; }
      @keyframes gs-jump {
        0% { transform: translateX(0); }
        20% { transform: translateX(-18px); }
        40% { transform: translateX(14px); }
        60% { transform: translateX(-8px); }
        80% { transform: translateX(20px); }
        100% { transform: translateX(0); }
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#gs-bg)"/>
  <g clip-path="url(#gs-clip)">
    <rect class="bar" x="0" y="20" width="220" height="24" fill="#ff2b4d"/>
    <rect class="bar bar2" x="0" y="52" width="220" height="24" fill="#ffe93d"/>
    <rect class="bar bar3" x="0" y="84" width="220" height="24" fill="#3dffb0"/>
    <rect class="bar bar4" x="0" y="116" width="220" height="24" fill="#3dc8ff"/>
    <rect class="bar bar5" x="0" y="148" width="220" height="24" fill="#a25bff"/>
  </g>
</svg>
