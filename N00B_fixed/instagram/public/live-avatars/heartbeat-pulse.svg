<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="hb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0710"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .heart { transform-origin: 100px 105px; animation: hb-beat 1.1s ease-in-out infinite; }
      .ekg { animation: hb-scan 2.2s linear infinite; }
      @keyframes hb-beat {
        0%, 100% { transform: scale(1); }
        15%      { transform: scale(1.18); }
        30%      { transform: scale(0.96); }
        45%      { transform: scale(1.1); }
        60%      { transform: scale(1); }
      }
      @keyframes hb-scan {
        0%   { stroke-dashoffset: 340; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#hb-bg)"/>

  <g class="heart">
    <path d="M100 130 C 60 100, 55 65, 80 55 C 92 50, 100 58, 100 68 C 100 58, 108 50, 120 55 C 145 65, 140 100, 100 130 Z"
      fill="#ff2d6d" filter="drop-shadow(0 0 8px #ff2d6d)"/>
  </g>

  <path class="ekg" d="M20 150 L60 150 L72 130 L84 168 L96 140 L104 150 L180 150"
    fill="none" stroke="#ff2d6d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    stroke-dasharray="340" opacity="0.85"/>
</svg>
