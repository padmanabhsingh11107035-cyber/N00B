<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ht-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="ht-clip"><circle cx="100" cy="100" r="95"/></clipPath>
    <style>
      .hex { animation: ht-zoom 2.2s linear infinite; transform-box: fill-box; transform-origin: center; }
      .h1 { animation-delay: 0s; } .h2 { animation-delay: -0.55s; } .h3 { animation-delay: -1.1s; } .h4 { animation-delay: -1.65s; }
      @keyframes ht-zoom { 0% { transform: scale(0.05); opacity: 0; } 15% { opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ht-bg)"/>
  <g clip-path="url(#ht-clip)">
    <polygon class="hex h1" points="100,15 175,57 175,142 100,185 25,142 25,57" fill="none" stroke="#ff2bd6" stroke-width="4"/>
    <polygon class="hex h2" points="100,15 175,57 175,142 100,185 25,142 25,57" fill="none" stroke="#ffe93d" stroke-width="4"/>
    <polygon class="hex h3" points="100,15 175,57 175,142 100,185 25,142 25,57" fill="none" stroke="#3dffb0" stroke-width="4"/>
    <polygon class="hex h4" points="100,15 175,57 175,142 100,185 25,142 25,57" fill="none" stroke="#3dc8ff" stroke-width="4"/>
  </g>
</svg>
