<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="hf-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="hf-clip"><circle cx="100" cy="100" r="70"/></clipPath>
    <style>
      .facets { animation: hf-hue 3s linear infinite; }
      @keyframes hf-hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
      .glint { animation: hf-glint 2s ease-in-out infinite; }
      .g2 { animation-delay: 0.6s; } .g3 { animation-delay: 1.2s; }
      @keyframes hf-glint { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#hf-bg)"/>
  <g class="facets" clip-path="url(#hf-clip)">
    <rect x="30" y="30" width="140" height="140" fill="#ff2bd6"/>
    <polygon points="30,30 100,60 60,100" fill="#ff8a3d"/>
    <polygon points="100,60 170,30 140,100" fill="#ffe93d"/>
    <polygon points="60,100 100,60 140,100 100,140" fill="#3dffb0"/>
    <polygon points="30,30 60,100 30,170" fill="#3dc8ff"/>
    <polygon points="170,30 170,170 140,100" fill="#a25bff"/>
    <polygon points="30,170 100,140 100,170" fill="#ff2b4d"/>
    <polygon points="100,140 170,170 100,170" fill="#4d5bff"/>
  </g>
  <circle class="glint" cx="80" cy="70" r="4" fill="#fff"/>
  <circle class="glint g2" cx="125" cy="90" r="3" fill="#fff"/>
  <circle class="glint g3" cx="95" cy="120" r="3.5" fill="#fff"/>
</svg>
