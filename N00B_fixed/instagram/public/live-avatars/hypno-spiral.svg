<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="hs-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0016"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="hs-clip"><circle cx="100" cy="100" r="95"/></clipPath>
    <style>
      .spiral { transform-origin: 100px 100px; animation: hs-spin 3s linear infinite; }
      @keyframes hs-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#hs-bg)"/>
  <g clip-path="url(#hs-clip)">
    <g class="spiral">
      <path d="M100 100 m 0,-90 a90,90 0 1,1 0,180 a70,70 0 1,0 0,-140 a50,50 0 1,1 0,100 a30,30 0 1,0 0,-60 a10,10 0 1,1 0,20"
        fill="none" stroke="#ff2bd6" stroke-width="14" stroke-linecap="round"/>
      <path d="M100 100 m 0,-90 a90,90 0 1,1 0,180 a70,70 0 1,0 0,-140 a50,50 0 1,1 0,100 a30,30 0 1,0 0,-60 a10,10 0 1,1 0,20"
        fill="none" stroke="#3dc8ff" stroke-width="14" stroke-linecap="round" transform="rotate(30 100 100)"/>
      <path d="M100 100 m 0,-90 a90,90 0 1,1 0,180 a70,70 0 1,0 0,-140 a50,50 0 1,1 0,100 a30,30 0 1,0 0,-60 a10,10 0 1,1 0,20"
        fill="none" stroke="#ffe93d" stroke-width="14" stroke-linecap="round" transform="rotate(60 100 100)"/>
      <path d="M100 100 m 0,-90 a90,90 0 1,1 0,180 a70,70 0 1,0 0,-140 a50,50 0 1,1 0,100 a30,30 0 1,0 0,-60 a10,10 0 1,1 0,20"
        fill="none" stroke="#3dffb0" stroke-width="14" stroke-linecap="round" transform="rotate(90 100 100)"/>
      <path d="M100 100 m 0,-90 a90,90 0 1,1 0,180 a70,70 0 1,0 0,-140 a50,50 0 1,1 0,100 a30,30 0 1,0 0,-60 a10,10 0 1,1 0,20"
        fill="none" stroke="#a25bff" stroke-width="14" stroke-linecap="round" transform="rotate(120 100 100)"/>
      <path d="M100 100 m 0,-90 a90,90 0 1,1 0,180 a70,70 0 1,0 0,-140 a50,50 0 1,1 0,100 a30,30 0 1,0 0,-60 a10,10 0 1,1 0,20"
        fill="none" stroke="#ff8a3d" stroke-width="14" stroke-linecap="round" transform="rotate(150 100 100)"/>
    </g>
  </g>
</svg>
