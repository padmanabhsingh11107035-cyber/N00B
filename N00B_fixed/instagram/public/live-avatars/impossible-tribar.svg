<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ib-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .tri { transform-origin: 100px 105px; animation: ib-spin 8s linear infinite, ib-glow 2.4s ease-in-out infinite; }
      @keyframes ib-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ib-glow { 0%, 100% { filter: drop-shadow(0 0 4px #ffffff); } 50% { filter: drop-shadow(0 0 12px #ffffff); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ib-bg)"/>
  <g class="tri">
    <polygon points="100,35 130,95 70,95" fill="#ff2b4d"/>
    <polygon points="130,95 160,155 100,140" fill="#ffe93d"/>
    <polygon points="70,95 100,140 40,155" fill="#3dc8ff"/>
    <polygon points="100,35 70,95 55,80" fill="#ff8a3d"/>
    <polygon points="130,95 160,155 145,140" fill="#3dffb0"/>
    <polygon points="40,155 100,140 85,168" fill="#a25bff"/>
  </g>
</svg>
