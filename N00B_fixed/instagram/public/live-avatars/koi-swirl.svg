<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ks-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#001a26"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .swirl { transform-origin: 100px 100px; animation: ks-spin 8s linear infinite; }
      .glow { animation: ks-glow 2.4s ease-in-out infinite; }
      @keyframes ks-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ks-glow { 0%, 100% { filter: drop-shadow(0 0 4px #ff8a3d); } 50% { filter: drop-shadow(0 0 12px #ffffff); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ks-bg)"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#2a4a55" stroke-width="2"/>
  <g class="swirl">
    <path class="glow" d="M100 50 C 130 50, 138 80, 118 95 C 100 108, 95 92, 100 82 C 104 74, 96 66, 100 50 Z" fill="#f5f5f0"/>
    <circle cx="107" cy="60" r="4" fill="#151515"/>
    <path class="glow" d="M100 150 C 70 150, 62 120, 82 105 C 100 92, 105 108, 100 118 C 96 126, 104 134, 100 150 Z" fill="#ff6a1a"/>
    <circle cx="93" cy="140" r="4" fill="#3a1400"/>
  </g>
</svg>
