<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mk-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0616"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .layer1 { transform-origin: 100px 100px; animation: mk-spin1 9s linear infinite; }
      .layer2 { transform-origin: 100px 100px; animation: mk-spin2 6s linear infinite reverse; }
      @keyframes mk-spin1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes mk-spin2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#mk-bg)"/>
  <g class="layer1">
    <g fill="#ff2bd6" opacity="0.8"><ellipse cx="100" cy="45" rx="10" ry="26"/><ellipse cx="100" cy="45" rx="10" ry="26" transform="rotate(60 100 100)"/><ellipse cx="100" cy="45" rx="10" ry="26" transform="rotate(120 100 100)"/><ellipse cx="100" cy="45" rx="10" ry="26" transform="rotate(180 100 100)"/><ellipse cx="100" cy="45" rx="10" ry="26" transform="rotate(240 100 100)"/><ellipse cx="100" cy="45" rx="10" ry="26" transform="rotate(300 100 100)"/></g>
  </g>
  <g class="layer2">
    <g fill="#3dc8ff" opacity="0.8"><ellipse cx="100" cy="60" rx="7" ry="18"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(45 100 100)"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(90 100 100)"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(135 100 100)"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(180 100 100)"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(225 100 100)"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(270 100 100)"/><ellipse cx="100" cy="60" rx="7" ry="18" transform="rotate(315 100 100)"/></g>
  </g>
  <circle cx="100" cy="100" r="14" fill="#ffe93d"/>
</svg>
