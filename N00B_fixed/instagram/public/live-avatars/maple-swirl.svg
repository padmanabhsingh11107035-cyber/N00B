<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f0f02"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="mp-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb03b"/>
      <stop offset="100%" stop-color="#c9410a"/>
    </linearGradient>
    <style>
      .leaf { transform-origin: 100px 100px; animation: mp-tumble 3.6s ease-in-out infinite; }
      @keyframes mp-tumble {
        0%   { transform: rotate(0deg) translateY(0); }
        50%  { transform: rotate(180deg) translateY(-8px); }
        100% { transform: rotate(360deg) translateY(0); }
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#mp-bg)"/>
  <g class="leaf">
    <path d="M100 45
      L108 75 L135 60 L120 88 L150 90 L122 105
      L138 130 L110 118 L112 150 L100 122
      L88 150 L90 118 L62 130 L78 105
      L50 90 L80 88 L65 60 L92 75 Z" fill="url(#mp-leaf)"/>
    <line x1="100" y1="70" x2="100" y2="150" stroke="#8a2c00" stroke-width="2"/>
  </g>
</svg>
