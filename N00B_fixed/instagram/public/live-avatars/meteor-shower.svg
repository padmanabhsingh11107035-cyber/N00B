<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ms-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ms-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="ms-clip"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .m1 { animation: ms-fly 1.8s linear infinite; }
      .m2 { animation: ms-fly 2.2s linear infinite 0.6s; }
      .m3 { animation: ms-fly 1.5s linear infinite 1.1s; }
      @keyframes ms-fly {
        0%   { transform: translate(-30px, -30px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translate(230px, 230px); opacity: 0; }
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ms-bg)"/>
  <g clip-path="url(#ms-clip)">
    <g class="m1" transform="translate(20 20)"><rect x="-26" y="-1.2" width="26" height="2.4" fill="url(#ms-tail)"/><circle r="3" fill="#fff3d6"/></g>
    <g class="m2" transform="translate(60 0)"><rect x="-20" y="-1" width="20" height="2" fill="url(#ms-tail)"/><circle r="2.2" fill="#fff3d6"/></g>
    <g class="m3" transform="translate(0 60)"><rect x="-22" y="-1" width="22" height="2" fill="url(#ms-tail)"/><circle r="2.5" fill="#fff3d6"/></g>
  </g>
</svg>
