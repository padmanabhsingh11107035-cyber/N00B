<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mr-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .a { transform-origin: 100px 100px; animation: mr-spin-a 6s linear infinite; }
      .b { transform-origin: 100px 100px; animation: mr-spin-b 5s linear infinite reverse; }
      @keyframes mr-spin-a { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes mr-spin-b { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#mr-bg)"/>
  <g class="a" fill="none" stroke-width="2.4">
    <circle cx="100" cy="70" r="34" stroke="#ff2bd6"/><circle cx="100" cy="70" r="46" stroke="#ff8a3d"/>
    <circle cx="100" cy="70" r="58" stroke="#ffe93d"/><circle cx="100" cy="70" r="70" stroke="#3dffb0"/>
    <circle cx="100" cy="70" r="82" stroke="#3dc8ff"/>
  </g>
  <g class="b" fill="none" stroke-width="2.4" opacity="0.85">
    <circle cx="100" cy="130" r="34" stroke="#3dc8ff"/><circle cx="100" cy="130" r="46" stroke="#3dffb0"/>
    <circle cx="100" cy="130" r="58" stroke="#ffe93d"/><circle cx="100" cy="130" r="70" stroke="#ff8a3d"/>
    <circle cx="100" cy="130" r="82" stroke="#ff2bd6"/>
  </g>
</svg>
