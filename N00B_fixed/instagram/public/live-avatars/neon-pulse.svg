<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="np-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1a12"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .ring { transform-origin: 100px 100px; animation: np-pulse 1.8s ease-in-out infinite; }
      .ring2 { transform-origin: 100px 100px; animation: np-pulse 1.8s ease-in-out infinite 0.6s; }
      .ring3 { transform-origin: 100px 100px; animation: np-pulse 1.8s ease-in-out infinite 1.2s; }
      .core { animation: np-glow 1.8s ease-in-out infinite; }
      @keyframes np-pulse {
        0%   { transform: scale(0.55); opacity: 0.9; }
        70%  { transform: scale(1.15); opacity: 0; }
        100% { transform: scale(1.15); opacity: 0; }
      }
      @keyframes np-glow {
        0%, 100% { filter: drop-shadow(0 0 4px #00FF66); }
        50%      { filter: drop-shadow(0 0 14px #00FF66); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#np-bg)"/>

  <circle class="ring" cx="100" cy="100" r="60" fill="none" stroke="#00FF66" stroke-width="3"/>
  <circle class="ring2" cx="100" cy="100" r="60" fill="none" stroke="#00FF66" stroke-width="3"/>
  <circle class="ring3" cx="100" cy="100" r="60" fill="none" stroke="#00FF66" stroke-width="3"/>

  <g class="core">
    <circle cx="100" cy="100" r="46" fill="#0a0f0c" stroke="#00FF66" stroke-width="2.5"/>
    <path d="M85 78 L85 122 L100 110 L115 122 L115 78 L100 90 Z" fill="#00FF66"/>
  </g>
</svg>
