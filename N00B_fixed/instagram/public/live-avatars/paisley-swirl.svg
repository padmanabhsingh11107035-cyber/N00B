<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ps-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .paisley { transform-origin: 100px 100px; animation: ps-spin 10s linear infinite, ps-hue 5s linear infinite; }
      @keyframes ps-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ps-hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ps-bg)"/>
  <g class="paisley">
    <path d="M100 40 C 140 40, 155 75, 135 100 C 120 118, 95 112, 95 95 C 95 82, 108 80, 112 90 C 115 97, 106 100, 103 95" fill="#ff2bd6"/>
    <path d="M100 40 C 140 40, 155 75, 135 100 C 120 118, 95 112, 95 95 C 95 82, 108 80, 112 90 C 115 97, 106 100, 103 95" fill="#ffe93d" transform="rotate(120 100 100)" opacity="0.85"/>
    <path d="M100 40 C 140 40, 155 75, 135 100 C 120 118, 95 112, 95 95 C 95 82, 108 80, 112 90 C 115 97, 106 100, 103 95" fill="#3dc8ff" transform="rotate(240 100 100)" opacity="0.85"/>
  </g>
</svg>
