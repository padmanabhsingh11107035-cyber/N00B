<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="pf-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#021814"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="pf-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="40%" stop-color="#00e676"/>
      <stop offset="75%" stop-color="#0f52ba"/>
      <stop offset="100%" stop-color="#4b0082"/>
    </radialGradient>
    <style>
      .feather { transform-origin: 100px 130px; animation: pf-sway 2.8s ease-in-out infinite; }
      .f1 { animation-delay: 0s; }
      .f2 { animation-delay: 0.3s; }
      .f3 { animation-delay: 0.6s; }
      .eye { animation: pf-shimmer 2s ease-in-out infinite; }
      @keyframes pf-sway {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(4deg); }
      }
      @keyframes pf-shimmer {
        0%, 100% { filter: drop-shadow(0 0 3px #00e676); }
        50%      { filter: drop-shadow(0 0 12px #ffd700); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#pf-bg)"/>

  <g transform="rotate(-28 100 130)"><g class="feather f1"><ellipse class="eye" cx="100" cy="75" rx="16" ry="24" fill="url(#pf-eye)"/><line x1="100" y1="99" x2="100" y2="140" stroke="#00693a" stroke-width="2"/></g></g>
  <g transform="rotate(0 100 130)"><g class="feather f2"><ellipse class="eye" cx="100" cy="65" rx="18" ry="28" fill="url(#pf-eye)"/><line x1="100" y1="93" x2="100" y2="140" stroke="#00693a" stroke-width="2"/></g></g>
  <g transform="rotate(28 100 130)"><g class="feather f3"><ellipse class="eye" cx="100" cy="75" rx="16" ry="24" fill="url(#pf-eye)"/><line x1="100" y1="99" x2="100" y2="140" stroke="#00693a" stroke-width="2"/></g></g>
</svg>
