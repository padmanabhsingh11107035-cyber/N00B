<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="pr-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="pr-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2b4d"/><stop offset="20%" stop-color="#ff8a3d"/>
      <stop offset="40%" stop-color="#ffe93d"/><stop offset="60%" stop-color="#3dffb0"/>
      <stop offset="80%" stop-color="#3dc8ff"/><stop offset="100%" stop-color="#a25bff"/>
    </linearGradient>
    <style>
      .fan { animation: pr-shimmer 2.4s ease-in-out infinite; }
      @keyframes pr-shimmer { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; filter: drop-shadow(0 0 8px #ffffff); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#pr-bg)"/>
  <line x1="20" y1="100" x2="82" y2="100" stroke="#ffffff" stroke-width="4"/>
  <polygon points="82,80 82,120 118,100" fill="#dbeeff" opacity="0.9" stroke="#ffffff" stroke-width="1.5"/>
  <g class="fan">
    <polygon points="118,100 175,55 168,68" fill="url(#pr-beam)" opacity="0.9"/>
    <polygon points="118,100 178,80 172,92" fill="url(#pr-beam)" opacity="0.85"/>
    <polygon points="118,100 180,100 172,105" fill="url(#pr-beam)" opacity="0.8"/>
    <polygon points="118,100 178,120 172,108" fill="url(#pr-beam)" opacity="0.85"/>
    <polygon points="118,100 175,145 168,132" fill="url(#pr-beam)" opacity="0.9"/>
  </g>
</svg>
