<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="rb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .spin { transform-origin: 100px 100px; animation: rb-spin 4s linear infinite; }
      .core { animation: rb-glow 2s ease-in-out infinite; }
      @keyframes rb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes rb-glow {
        0%, 100% { filter: drop-shadow(0 0 3px #fff); }
        50%      { filter: drop-shadow(0 0 10px #fff); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#rb-bg)"/>

  <!-- circumference of r=62 is ~389.6; each circle draws exactly one 55-unit
       arc (then one long gap covering the rest), rotated into its own 1/6
       slot via dashoffset, so the 6 arcs tile the ring without repeating. -->
  <g class="spin">
    <circle cx="100" cy="100" r="62" fill="none" stroke="#ff3b3b" stroke-width="9" stroke-dasharray="55 335" stroke-dashoffset="0"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#ff9100" stroke-width="9" stroke-dasharray="55 335" stroke-dashoffset="-65"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#ffee00" stroke-width="9" stroke-dasharray="55 335" stroke-dashoffset="-130"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#00e676" stroke-width="9" stroke-dasharray="55 335" stroke-dashoffset="-195"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#00b0ff" stroke-width="9" stroke-dasharray="55 335" stroke-dashoffset="-260"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#c77dff" stroke-width="9" stroke-dasharray="55 335" stroke-dashoffset="-325"/>
  </g>

  <circle class="core" cx="100" cy="100" r="42" fill="#0a0a0a" stroke="#fff" stroke-width="1.5"/>
</svg>
