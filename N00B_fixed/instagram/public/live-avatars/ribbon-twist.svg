<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="rt-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08060c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2b4d"/><stop offset="20%" stop-color="#ff8a3d"/>
      <stop offset="40%" stop-color="#ffe93d"/><stop offset="60%" stop-color="#3dffb0"/>
      <stop offset="80%" stop-color="#3dc8ff"/><stop offset="100%" stop-color="#a25bff"/>
    </linearGradient>
    <style>
      .segment { transform-box: fill-box; transform-origin: center; animation: rt-flip 2s ease-in-out infinite; }
      .s2 { animation-delay: 0.15s; } .s3 { animation-delay: 0.3s; } .s4 { animation-delay: 0.45s; }
      .s5 { animation-delay: 0.6s; } .s6 { animation-delay: 0.75s; } .s7 { animation-delay: 0.9s; }
      @keyframes rt-flip { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.15); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#rt-bg)"/>
  <g fill="url(#rt-grad)">
    <rect class="segment" x="55" y="40" width="90" height="14" rx="3"/>
    <rect class="segment s2" x="55" y="58" width="90" height="14" rx="3"/>
    <rect class="segment s3" x="55" y="76" width="90" height="14" rx="3"/>
    <rect class="segment s4" x="55" y="94" width="90" height="14" rx="3"/>
    <rect class="segment s5" x="55" y="112" width="90" height="14" rx="3"/>
    <rect class="segment s6" x="55" y="130" width="90" height="14" rx="3"/>
    <rect class="segment s7" x="55" y="148" width="90" height="14" rx="3"/>
  </g>
</svg>
