<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="rp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#021826"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .rip1 { transform-origin: 100px 100px; animation: rp-out 2.4s ease-out infinite; }
      .rip2 { transform-origin: 100px 100px; animation: rp-out 2.4s ease-out infinite 0.8s; }
      .rip3 { transform-origin: 100px 100px; animation: rp-out 2.4s ease-out infinite 1.6s; }
      .drop { animation: rp-bob 2.4s ease-in-out infinite; }
      @keyframes rp-out {
        0%   { transform: scale(0.3); opacity: 0.9; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes rp-bob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(4px); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#rp-bg)"/>

  <circle class="rip1" cx="100" cy="100" r="50" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <circle class="rip2" cx="100" cy="100" r="50" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <circle class="rip3" cx="100" cy="100" r="50" fill="none" stroke="#00E5FF" stroke-width="2.5"/>

  <g class="drop">
    <circle cx="100" cy="100" r="30" fill="#04202e" stroke="#00E5FF" stroke-width="2"/>
    <path d="M100 82 C 92 94, 88 102, 100 112 C 112 102, 108 94, 100 82 Z" fill="#00E5FF"/>
  </g>
</svg>
