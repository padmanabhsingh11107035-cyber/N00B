<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f0d17"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="sb-clip"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .petal { animation: sb-fall 4s linear infinite; }
      .p2 { animation-delay: 1s; } .p3 { animation-delay: 2s; } .p4 { animation-delay: 3s; }
      @keyframes sb-fall {
        0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
        10%  { opacity: 1; }
        100% { transform: translate(30px, 200px) rotate(360deg); opacity: 0; }
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#sb-bg)"/>
  <g clip-path="url(#sb-clip)">
    <g transform="translate(50 40)" class="petal"><path d="M0 -6 C 4 -6, 6 -2, 4 2 C 2 6, -2 6, -4 2 C -6 -2, -4 -6, 0 -6 Z" fill="#ffc2e0"/></g>
    <g transform="translate(110 20)" class="petal p2"><path d="M0 -6 C 4 -6, 6 -2, 4 2 C 2 6, -2 6, -4 2 C -6 -2, -4 -6, 0 -6 Z" fill="#ffb3d9"/></g>
    <g transform="translate(150 55)" class="petal p3"><path d="M0 -6 C 4 -6, 6 -2, 4 2 C 2 6, -2 6, -4 2 C -6 -2, -4 -6, 0 -6 Z" fill="#ffc2e0"/></g>
    <g transform="translate(75 10)" class="petal p4"><path d="M0 -6 C 4 -6, 6 -2, 4 2 C 2 6, -2 6, -4 2 C -6 -2, -4 -6, 0 -6 Z" fill="#ffd6ea"/></g>
  </g>
  <g transform="translate(100 108)">
    <path d="M0 -30 C 20 -30, 30 -12, 26 0 C 20 -10, 10 -14, 0 0 C -10 -14, -20 -10, -26 0 C -30 -12, -20 -30, 0 -30 Z" fill="#ff9ecb" opacity="0.9" transform="scale(0.9)"/>
    <circle r="6" fill="#ffe6a8"/>
  </g>
</svg>
