<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ss-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#020a24"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ss-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aad4ff"/>
      <stop offset="50%" stop-color="#0f52ba"/>
      <stop offset="100%" stop-color="#052a63"/>
    </linearGradient>
    <style>
      .spin { transform-origin: 100px 100px; animation: ss-spin 5s linear infinite; }
      .core { animation: ss-pulse 2.4s ease-in-out infinite; }
      @keyframes ss-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ss-pulse {
        0%, 100% { filter: drop-shadow(0 0 5px #0f52ba); }
        50%      { filter: drop-shadow(0 0 16px #4d9fff); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#ss-bg)"/>

  <g class="spin">
    <path d="M100 100 C 130 85, 150 100, 145 130 C 140 155, 110 158, 100 135" fill="none" stroke="url(#ss-gem)" stroke-width="10" stroke-linecap="round"/>
    <path d="M100 100 C 70 115, 50 100, 55 70 C 60 45, 90 42, 100 65" fill="none" stroke="url(#ss-gem)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <circle class="core" cx="100" cy="100" r="24" fill="url(#ss-gem)" stroke="#cdefff" stroke-width="2"/>
</svg>
