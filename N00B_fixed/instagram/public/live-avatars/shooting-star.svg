<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ss-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ss-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="ss-clip"><circle cx="100" cy="100" r="100"/></clipPath>
    <style>
      .star { animation: ss-fly 2.6s ease-in infinite; }
      .twinkle { animation: ss-twinkle 1.6s ease-in-out infinite; }
      .t2 { animation-delay: 0.5s; } .t3 { animation-delay: 1s; }
      @keyframes ss-fly {
        0%   { transform: translate(-40px, -40px); opacity: 0; }
        15%  { opacity: 1; }
        75%  { transform: translate(140px, 140px); opacity: 1; }
        100% { transform: translate(160px, 160px); opacity: 0; }
      }
      @keyframes ss-twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#ss-bg)"/>
  <g clip-path="url(#ss-clip)">
    <circle class="twinkle" cx="140" cy="50" r="1.6" fill="#fff"/>
    <circle class="twinkle t2" cx="50" cy="70" r="1.4" fill="#fff"/>
    <circle class="twinkle t3" cx="150" cy="120" r="1.8" fill="#fff"/>
    <circle class="twinkle t2" cx="60" cy="150" r="1.5" fill="#fff"/>
    <g class="star">
      <rect x="-30" y="-1.5" width="30" height="3" fill="url(#ss-tail)"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
