<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sw-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0220"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sw-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <style>
      rect.bar { transform-box: fill-box; transform-origin: center; }
      .b1 { animation: sw-bounce 1.1s ease-in-out infinite; }
      .b2 { animation: sw-bounce 1.1s ease-in-out infinite 0.15s; }
      .b3 { animation: sw-bounce 1.1s ease-in-out infinite 0.3s; }
      .b4 { animation: sw-bounce 1.1s ease-in-out infinite 0.45s; }
      .b5 { animation: sw-bounce 1.1s ease-in-out infinite 0.6s; }
      @keyframes sw-bounce {
        0%, 100% { transform: scaleY(0.3); }
        50%      { transform: scaleY(1); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#sw-bg)"/>

  <rect class="bar b1" x="52" y="80" width="12" height="40" rx="6" fill="url(#sw-bar)"/>
  <rect class="bar b2" x="72" y="65" width="12" height="70" rx="6" fill="url(#sw-bar)"/>
  <rect class="bar b3" x="94" y="50" width="12" height="100" rx="6" fill="url(#sw-bar)"/>
  <rect class="bar b4" x="116" y="65" width="12" height="70" rx="6" fill="url(#sw-bar)"/>
  <rect class="bar b5" x="136" y="80" width="12" height="40" rx="6" fill="url(#sw-bar)"/>
</svg>
