<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sw2-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <clipPath id="sw2-clip"><circle cx="100" cy="100" r="95"/></clipPath>
    <style>
      .band { animation: sw2-flow 2.4s ease-in-out infinite; }
      .b2 { animation-delay: -0.3s; } .b3 { animation-delay: -0.6s; } .b4 { animation-delay: -0.9s; }
      .b5 { animation-delay: -1.2s; } .b6 { animation-delay: -1.5s; } .b7 { animation-delay: -1.8s; }
      @keyframes sw2-flow { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#sw2-bg)"/>
  <g clip-path="url(#sw2-clip)" transform="translate(0 100)">
    <g fill-opacity="0.9">
      <rect class="band" x="20" y="-70" width="18" height="140" fill="#ff2b4d" style="transform-box:fill-box;transform-origin:center"/>
      <rect class="band b2" x="42" y="-70" width="18" height="140" fill="#ff8a3d" style="transform-box:fill-box;transform-origin:center"/>
      <rect class="band b3" x="64" y="-70" width="18" height="140" fill="#ffe93d" style="transform-box:fill-box;transform-origin:center"/>
      <rect class="band b4" x="86" y="-70" width="18" height="140" fill="#a3ff3d" style="transform-box:fill-box;transform-origin:center"/>
      <rect class="band b5" x="108" y="-70" width="18" height="140" fill="#3dffb0" style="transform-box:fill-box;transform-origin:center"/>
      <rect class="band b6" x="130" y="-70" width="18" height="140" fill="#3dc8ff" style="transform-box:fill-box;transform-origin:center"/>
      <rect class="band b7" x="152" y="-70" width="18" height="140" fill="#a25bff" style="transform-box:fill-box;transform-origin:center"/>
    </g>
  </g>
</svg>
