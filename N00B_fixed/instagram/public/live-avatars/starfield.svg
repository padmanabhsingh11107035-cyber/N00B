<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sf-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <style>
      .spin { transform-origin: 100px 100px; animation: sf-spin 18s linear infinite; }
      .s1 { animation: sf-twinkle 1.4s ease-in-out infinite; }
      .s2 { animation: sf-twinkle 1.8s ease-in-out infinite 0.3s; }
      .s3 { animation: sf-twinkle 1.2s ease-in-out infinite 0.6s; }
      .s4 { animation: sf-twinkle 2.1s ease-in-out infinite 0.9s; }
      .s5 { animation: sf-twinkle 1.6s ease-in-out infinite 1.2s; }
      .moon { animation: sf-glow 3s ease-in-out infinite; }
      @keyframes sf-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes sf-twinkle {
        0%, 100% { opacity: 0.25; }
        50%      { opacity: 1; }
      }
      @keyframes sf-glow {
        0%, 100% { filter: drop-shadow(0 0 3px #cfd8ff); }
        50%      { filter: drop-shadow(0 0 10px #cfd8ff); }
      }
    </style>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#sf-bg)"/>

  <g class="spin">
    <circle class="s1" cx="55" cy="50" r="2.2" fill="#fff"/>
    <circle class="s2" cx="150" cy="60" r="1.8" fill="#fff"/>
    <circle class="s3" cx="40" cy="130" r="1.6" fill="#fff"/>
    <circle class="s4" cx="160" cy="140" r="2" fill="#fff"/>
    <circle class="s5" cx="100" cy="35" r="1.5" fill="#fff"/>
    <circle class="s3" cx="30" cy="90" r="1.4" fill="#fff"/>
    <circle class="s2" cx="170" cy="100" r="1.6" fill="#fff"/>
    <circle class="s1" cx="110" cy="165" r="1.8" fill="#fff"/>
  </g>

  <circle class="moon" cx="100" cy="100" r="30" fill="#e8ecff"/>
  <circle cx="112" cy="90" r="6" fill="#050518" opacity="0.5"/>
  <circle cx="90" cy="108" r="4" fill="#050518" opacity="0.4"/>
</svg>
