<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="uh-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0d24"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="uh-horn" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9ecb"/>
      <stop offset="33%" stop-color="#ffe08a"/>
      <stop offset="66%" stop-color="#9effc2"/>
      <stop offset="100%" stop-color="#a5c9ff"/>
    </linearGradient>
    <style>
      .horn { animation: uh-glow 2s ease-in-out infinite; }
      .sparkle { animation: uh-twinkle 1.4s ease-in-out infinite; }
      .sp2 { animation-delay: 0.4s; } .sp3 { animation-delay: 0.9s; }
      @keyframes uh-glow { 0%, 100% { filter: drop-shadow(0 0 6px #ffb3e6); } 50% { filter: drop-shadow(0 0 18px #cdb3ff); } }
      @keyframes uh-twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#uh-bg)"/>
  <path class="horn" d="M100 40 L112 165 L88 165 Z" fill="url(#uh-horn)"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.55">
    <path d="M92 60 L108 65"/><path d="M90 85 L110 90"/><path d="M88 110 L112 115"/><path d="M86 135 L114 140"/>
  </g>
  <path class="sparkle" d="M60 70 L64 78 L72 82 L64 86 L60 94 L56 86 L48 82 L56 78 Z" fill="#ffffff"/>
  <path class="sparkle sp2" d="M145 100 L148 106 L154 109 L148 112 L145 118 L142 112 L136 109 L142 106 Z" fill="#ffffff"/>
  <path class="sparkle sp3" d="M130 60 L132 65 L137 67 L132 69 L130 74 L128 69 L123 67 L128 65 Z" fill="#ffffff"/>
</svg>
