<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="wh-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="wh-moon" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="100%" stop-color="#e6e2c8"/>
    </radialGradient>
    <style>
      .moon { animation: wh-glow 2.6s ease-in-out infinite; }
      .wolf { transform-box: fill-box; transform-origin: bottom center; animation: wh-howl 3s ease-in-out infinite; }
      @keyframes wh-glow { 0%, 100% { filter: drop-shadow(0 0 6px #fffdf0); } 50% { filter: drop-shadow(0 0 16px #fffdf0); } }
      @keyframes wh-howl { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg) translateY(-2px); } }
    </style>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#wh-bg)"/>
  <circle class="moon" cx="100" cy="70" r="34" fill="url(#wh-moon)"/>
  <g class="wolf" fill="#0a0d16">
    <path d="M100 175 L70 130 C 65 110, 80 90, 90 95 L92 80 L100 92 L108 80 L110 95 C 120 90, 135 110, 130 130 Z"/>
  </g>
</svg>
