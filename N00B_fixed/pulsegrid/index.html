<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#06020d" />
    <meta name="description" content="A 3D rhythm-dance game. Enter directional sequences, hit Space on beat, and press the opposite direction for red prompts. Play offline with keyboard, touch or gamepad." />
    <title>PulseGrid Arena · Made by NOOB developers</title>
    <meta name="author" content="NOOB developers" />
        <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06020d; }
      #loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; color: #f6f2ff; background: #06020d; font: 500 16px/1.5 system-ui, sans-serif; transition: opacity .45s ease, visibility .45s; }
      #loader.is-done { opacity: 0; visibility: hidden; }
      #loader .box { display: flex; width: min(420px, 88vw); flex-direction: column; align-items: center; text-align: center; }
      #loader .mark { width: 56px; height: 56px; margin-bottom: 18px; border-radius: 14px; box-shadow: 0 0 30px rgba(40, 240, 255, .24); }
      #loader h1 { margin: 0; font: 900 italic clamp(30px, 8vw, 48px)/1 system-ui, sans-serif; letter-spacing: -.04em; background: linear-gradient(100deg, #ff2bd6, #28f0ff); color: transparent; background-clip: text; -webkit-background-clip: text; }
      #loader .tip { min-height: 1.5em; margin: 12px 0 18px; color: #c1b7dc; }
      #loader .bar { position: relative; width: 100%; height: 9px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
      #loader .bar i { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; border-radius: inherit; background: linear-gradient(90deg, #ff2bd6, #ffd84a, #28f0ff); transition: transform .2s ease-out; }
      #loader .pct { margin: 9px 0 0; color: #a99cc9; font: 700 12px/1 system-ui, sans-serif; letter-spacing: .2em; }
      #loader .retry { display: none; margin-top: 16px; padding: 10px 18px; border: 1px solid rgba(40,240,255,.5); border-radius: 10px; color: #f6f2ff; background: #15102b; font: 700 14px system-ui, sans-serif; cursor: pointer; }
      #loader .retry.is-on { display: inline-flex; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #loader, #loader .bar i { transition: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <main class="box">
        <img class="mark" src="/assets/share/favicon.png" width="56" height="56" alt="" />
        <h1>PulseGrid Arena</h1>
        <p class="tip">Setting the stage…</p>
        <div class="bar" aria-hidden="true"><i></i></div>
        <p class="pct">0%</p>
        <button class="retry" type="button">Retry</button>
      </main>
    </div>
    <canvas id="game" aria-label="PulseGrid Arena 3D stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
